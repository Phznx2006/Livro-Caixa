<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Livro-Caixa</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;1,500&family=Source+Serif+4:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <h1>Livro-Caixa</h1>
    <nav class="month" aria-label="Mês">
      <button id="prev" aria-label="Mês anterior">‹</button>
      <span id="monthLabel"></span>
      <button id="next" aria-label="Próximo mês">›</button>
    </nav>
  </header>

  <main>
    <section class="balance">
      <p class="muted">Saldo total</p>
      <p id="total" class="big"></p>
      <div class="pair">
        <div><p class="muted">Entradas do mês</p><p id="inc" class="pos"></p></div>
        <div><p class="muted">Saídas do mês</p><p id="exp" class="neg"></p></div>
        <div><p class="muted">Resultado do mês</p><p id="net"></p></div>
      </div>
    </section>

    <section class="card">
      <h2 id="formTitle">Novo lançamento</h2>
      <form id="form" autocomplete="off">
        <div class="seg">
          <label><input type="radio" name="type" value="saida" checked><span>Saída</span></label>
          <label><input type="radio" name="type" value="entrada"><span>Entrada</span></label>
        </div>
        <input id="desc" placeholder="Descrição" required maxlength="60">
        <input id="amount" inputmode="decimal" maxlength="16" placeholder="Valor (R$) — ex.: 1.250,50" required>
        <select id="cat"></select>
        <input id="date" type="date" required>
        <button id="submit" class="gold" type="submit">Lançar</button>
        <button id="cancel" class="ghost" type="button" hidden>Cancelar edição</button>
      </form>
    </section>

    <section class="card">
      <h2>Gastos por categoria</h2>
      <div id="cats"></div>
    </section>

    <section class="card wide">
      <h2>Lançamentos por dia</h2>
      <div id="list"></div>
    </section>
  </main>

  <footer>
    <button id="export" class="ghost">Exportar backup</button>
    <label class="ghost">Importar backup<input id="import" type="file" accept=".json" hidden></label>
    <p class="muted">Os dados ficam salvos só neste navegador.</p>
  </footer>
  <script src="script.js"></script>
</body>
</html>
